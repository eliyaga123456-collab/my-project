# Publishes ./site to the gh-pages branch. Then: Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Publish site
on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-volta-5foywr, main]
    paths: ["site/**", ".github/workflows/pages.yml"]
permissions:
  contents: write
concurrency: { group: pages-publish, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages
        run: |
          rm -rf /tmp/site && cp -r site /tmp/site && touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
