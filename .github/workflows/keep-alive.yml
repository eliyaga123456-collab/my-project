name: Keep server awake
# Render's free plan puts the service to sleep after ~15 min without traffic; the first request after
# that takes 30-60 s. Pinging /health every 10 minutes avoids that. Scheduled workflows only run
# from the repository's DEFAULT branch, so this starts working once this file is on main.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://ear-8ii9.onrender.com/health
