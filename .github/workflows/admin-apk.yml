# Builds the EAR Admin Android app (a secure shell around the hosted admin console) and attaches it to release tag `admin-apk`.
name: Admin APK
on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-volta-5foywr]
    paths: ["admin-app/**", ".github/workflows/admin-apk.yml"]
permissions:
  contents: write
concurrency: { group: admin-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null || true
      - name: Install
        working-directory: admin-app
        run: npm install --no-audit --no-fund && npm install --no-audit --no-fund --save-dev babel-preset-expo
      - name: Generate the native project
        working-directory: admin-app
        env:
          EXPO_PUBLIC_API_URL: https://ear-8ii9.onrender.com
          EAR_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK (arm64)
        working-directory: admin-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp admin-app/android/app/build/outputs/apk/release/app-release.apk EAR-Admin.apk
          gh release delete admin-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create admin-apk EAR-Admin.apk --target "$GITHUB_SHA" --latest=false --title "EAR Admin app" --notes "Admin console app for the EAR owner. Sign in with the admin account."
