name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_USER: postgres, POSTGRES_DB: unsaid_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/unsaid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: API tests
        run: npm test -w @unsaid/api
      - name: API production build
        run: npm run build -w @unsaid/api
      - name: Web unit tests
        run: npm test -w @unsaid/web
      - name: Web build
        run: npm run build -w @unsaid/web
        env: { API_URL: "https://api.example.com", NEXT_PUBLIC_SITE_URL: "https://ear.example.com" }
      - name: Admin build
        run: npm run build -w @unsaid/admin
      - name: Mobile tests
        run: npm test -w @unsaid/mobile
