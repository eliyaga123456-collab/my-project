# Render Blueprint (repo root so Render finds it automatically): ONE free web service runs the website + API together (see /Dockerfile).
# New > Blueprint > pick this repo. You only need to paste DATABASE_URL (Neon). Everything else is set here.
services:
  - type: web
    name: ear
    runtime: docker
    plan: free
    branch: claude/elegant-volta-5foywr   # switch to main after the merge
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: AUTO_MIGRATE, value: "true" }
      - { key: TRUST_PROXY, value: "loopback,linklocal,uniquelocal" }  # trust only private proxies (Render + the Next.js proxy)
      - { key: COOKIE_SECURE, value: "true" }
      - { key: APP_SECRET, generateValue: true }
      - { key: DATABASE_URL, sync: false }    # Neon connection string
      - { key: EMAIL_TRANSPORT, value: log }  # no real emails until you add SMTP (see docs/DEPLOY_FREE.he.md)
      - { key: EXPO_PUSH_ENABLED, value: "false" }
